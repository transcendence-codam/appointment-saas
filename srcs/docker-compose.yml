services:

  postgres:
    image: postgres:16-alpine
    container_name: postgres
    restart: unless-stopped
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: ${DATABASE_USER}
      POSTGRES_PASSWORD: ${DATABASE_PASSWORD}
      POSTGRES_DB: ${DATABASE_NAME}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DATABASE_USER} -d ${DATABASE_NAME}"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ..
      dockerfile: srcs/backend/Dockerfile
    image: nestjs
    container_name: nestjs
    restart: unless-stopped
    command: sh -c "npx prisma generate && npx prisma migrate deploy && npm run start:dev"
    volumes:
      - ./backend:/app/srcs/backend
      - /app/node_modules
      - /app/srcs/backend/node_modules
    ports:
      - "3001:3001"
    environment:
      PORT: 3001
      DATABASE_URL: postgres://${DATABASE_USER}:${DATABASE_PASSWORD}@${DATABASE_HOST}:${DATABASE_PORT}/${DATABASE_NAME}
    depends_on:
      postgres:
        condition: service_healthy

  frontend:
    build:
      context: ..
      dockerfile: srcs/frontend/Dockerfile
    image: react
    container_name: react
    restart: unless-stopped
    volumes:
      - ./frontend:/app/srcs/frontend
      - /app/node_modules
      - /app/srcs/frontend/node_modules
    ports:
      - "3000:3000"
    environment:
      - CHOKIDAR_USEPOLLING=true
    depends_on:
      - backend

volumes:
  postgres_data:
